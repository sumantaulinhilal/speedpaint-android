name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a637b3744d16de1220079dddb497d909c" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo "89330d22263015100398d459cb0746b92a6631e3" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare environment and files
      run: |
        mkdir -p ~/.android
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > ~/.android/debug.keystore
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        touch .env
        touch .env.example

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error



